<!doctype html>

  <head>

  </head>
  <body>
    <template>
      <style>

        #sub { position:absolute; left:0; right:0; top: 620px; text-align:center; font-size: 52px; font-weight: 700; color:#eaf0ff; opacity:0; }

      <div id="root" data-composition-id="s01" data-width="1920" data-height="1080">

            <svg viewBox="0 0 200 200">
              <circle class="path" cx="100" cy="100" r="80" />
              <circle class="orb" cx="100" cy="100" r="26" />

        </div>

      <script>
        (function () {
          window.__timelines = window.__timelines || {};
          const tl = gsap.timeline({ paused: true });
          tl.fromTo("#kicker", {opacity:0, y:20}, {opacity:1, y:0, duration:0.6, ease:"back.out(1.4)"}, 0.5);
          tl.fromTo("#title", {opacity:0, y:50}, {opacity:1, y:0, duration:0.9, ease:"power3.out"}, 1.2);
          tl.fromTo("#sub", {opacity:0, y:24}, {opacity:1, y:0, duration:0.6, ease:"back.out(1.4)"}, 2.4);
          tl.fromTo("#ring", {opacity:0, y:20}, {opacity:1, y:0, duration:0.6, ease:"back.out(1.4)"}, 3.2);
          tl.to("#orbit", {rotation: 360 * 4, svgOrigin:"100 100", duration:19.08, ease:"none"}, 0);
          tl.to("#body", {x:-190, opacity:0, duration:0.45, ease:"power3.in"}, 18.63);

          window.__timelines["s01"] = tl;
        })();
      </script>
    </template>
